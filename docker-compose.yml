services:
  mysql:
    image: mysql:8.4
    container_name: bogensport-mysql
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      TZ: Europe/Berlin
    ports:
      - "3306:3306"
    volumes:
      - bogensport_mysql_data:/var/lib/mysql
      - ./private/member-area/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bogensport_mysql_data:
